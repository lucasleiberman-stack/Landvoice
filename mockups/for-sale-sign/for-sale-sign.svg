<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -80 720 1230" width="720" height="1230"><title>For sale sign (black and white)</title>
  <defs>
    <linearGradient id="postShade" x1="0" x2="1"><stop offset="0" stop-color="#e9e9e9"/><stop offset=".45" stop-color="#ffffff"/><stop offset="1" stop-color="#cfcfcf"/></linearGradient>
    <linearGradient id="boardSheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".10"/><stop offset=".5" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".18"/></linearGradient>
  </defs>
  <rect id="Post" x="-16" y="-44" width="28" height="1109" rx="3" fill="url(#postShade)" stroke="#bdbdbd" stroke-width="1.2"/>
  <rect id="Arm" x="-16" y="-44" width="640" height="26" rx="3" fill="url(#postShade)" stroke="#bdbdbd" stroke-width="1.2"/>
  <rect id="Hook left" x="110" y="-20" width="14" height="30" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <rect id="Hook right" x="476" y="-20" width="14" height="30" fill="#ffffff" stroke="#bdbdbd" stroke-width="1"/>
  <g id="Board">
    <rect x="0" y="0" width="600" height="440" rx="12" fill="#0a0a0a"/>
    <rect x="0" y="0" width="600" height="440" rx="12" fill="url(#boardSheen)"/>
    <rect x="20" y="20" width="560" height="400" rx="5" fill="none" stroke="#ffffff" stroke-width="4"/>
    <text x="300" y="218" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="900" font-size="138" textLength="470" lengthAdjust="spacingAndGlyphs" fill="#ffffff">FOR SALE</text>
    <line x1="92" y1="268" x2="508" y2="268" stroke="#ffffff" stroke-width="4"/>
    <text x="300" y="352" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="72" textLength="400" lengthAdjust="spacingAndGlyphs" fill="#ffffff">(415) 555-0142</text>
  </g></svg>